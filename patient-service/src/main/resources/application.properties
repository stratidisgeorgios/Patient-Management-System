spring.application.name=patient-service
server.port=4000
grpc.server.port=9003
logging.level.root=INFO
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.patientsystem.patientservice.multitenancy.TenantIdentifierResolver
aws.s3.bucket=${AWS_S3_BUCKET}
aws.region=${AWS_REGION:eu-west-1}
aws.sqs.import-queue-url=${AWS_SQS_IMPORT_QUEUE_URL}
spring.cloud.aws.region.static=${AWS_REGION}
