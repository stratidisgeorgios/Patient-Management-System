name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # OIDC token for AWS role assumption
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install proto module
        run: mvn install -pl proto -am --no-transfer-progress -q
      - name: Run unit and integration tests
        run: mvn test --no-transfer-progress

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patient-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: patient-frontend
      - name: Run Angular unit tests
        run: npx ng test --no-watch --browsers=ChromeHeadless
        working-directory: patient-frontend

  detect-changes:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep -oP '^(api-gateway|patient-service|search-service|organization-service|billing-service|analytics-service|treatment-service)' \
            | sort -u | jq -Rsc 'split("\n")[:-1]')
          echo "services=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed services: $CHANGED"

  build-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: eu-west-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/patient-system/${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/patient-system/${{ matrix.service }}:latest \
            -f ${{ matrix.service }}/Dockerfile \
            ${{ matrix.service }}/
          docker push $ECR_REGISTRY/patient-system/${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/patient-system/${{ matrix.service }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: eu-west-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region eu-west-1 --name prod-patient-system

      # kubectl set image commands are added in Phase 4 when K8s manifests exist

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patient-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: patient-frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: patient-frontend

      - name: Run E2E tests
        env:
          E2E_BASE_URL: https://patientsystem.me
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npx playwright test
        working-directory: patient-frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: patient-frontend/playwright-report/
          retention-days: 7
