name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all services (bootstrap deploy)'
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC token for AWS role assumption
  contents: write   # write needed to commit updated image tags for ArgoCD

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Install proto module
        run: mvn install -pl proto -am --no-transfer-progress -q
      - name: Run unit and integration tests
        run: mvn test --no-transfer-progress

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patient-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: patient-frontend
      - name: Run Angular unit tests
        run: npx ng test --no-watch
        working-directory: patient-frontend

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: patient-frontend

  detect-changes:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event.inputs.build_all }}" = "true" ]; then
            CHANGED='["api-gateway","patient-service","search-service","organization-service","billing-service","analytics-service","treatment-service"]'
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep -oP '^(api-gateway|patient-service|search-service|organization-service|billing-service|analytics-service|treatment-service)' \
              | sort -u | jq -Rsc 'split("\n")[:-1]')
          fi
          echo "services=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed services: $CHANGED"

  build-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: eu-west-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/patient-system/${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/patient-system/${{ matrix.service }}:latest \
            -f ${{ matrix.service }}/Dockerfile \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/patient-system/${{ matrix.service }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/patient-system/${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/patient-system/${{ matrix.service }}:latest

  deploy:
    needs: [build-push, detect-changes]
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-west-1.amazonaws.com
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: eu-west-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region eu-west-1 --name prod-patient-system

      - name: Update image tags in K8s manifests
        run: |
          SERVICES='${{ needs.detect-changes.outputs.services }}'
          for SERVICE in $(echo "$SERVICES" | jq -r '.[]'); do
            MANIFEST="k8s/services/${SERVICE}/deployment.yaml"
            if [ -f "$MANIFEST" ]; then
              sed -i "s|${ECR_REGISTRY}/patient-system/${SERVICE}:.*|${ECR_REGISTRY}/patient-system/${SERVICE}:${{ github.sha }}|g" "$MANIFEST"
              echo "Updated $MANIFEST to ${{ github.sha }}"
            fi
          done

      - name: Commit updated image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/services/
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "ci: update image tags to ${{ github.sha }}"
            git pull --rebase
            git push
          fi

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/namespaces.yaml
          kubectl apply -f k8s/secrets/ -n patient-system
          kubectl apply -f k8s/services/ --recursive
          kubectl apply -f k8s/ingress/

      - name: Wait for rollout
        run: |
          SERVICES='${{ needs.detect-changes.outputs.services }}'
          for SERVICE in $(echo "$SERVICES" | jq -r '.[]'); do
            echo "Waiting for $SERVICE rollout..."
            kubectl rollout status deployment/$SERVICE -n patient-system --timeout=300s
          done

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patient-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: patient-frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: patient-frontend

      - name: Run E2E tests
        env:
          E2E_BASE_URL: https://patientsystem.me
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npx playwright test
        working-directory: patient-frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: patient-frontend/playwright-report/
          retention-days: 7
