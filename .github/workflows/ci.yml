name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install proto module
        run: mvn install -pl proto -am --no-transfer-progress -q

      - name: Run unit and integration tests
        run: mvn test --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: patient-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: patient-frontend

      - name: Run Angular unit tests
        run: npx ng test --no-watch
        working-directory: patient-frontend

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: patient-frontend

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Populate Maven cache
        run: |
          mvn install -pl proto -am --no-transfer-progress -q
          mvn dependency:resolve --no-transfer-progress -q

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
