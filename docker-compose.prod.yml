services:

  redis:
    image: redis:latest
    networks:
      - patient-network

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    image: patient-service:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ADDRESS}:5432/patient_db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      GRPC_SERVER_PORT: 9003
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_SQS_IMPORT_QUEUE_URL: ${AWS_SQS_IMPORT_QUEUE_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    networks:
      - patient-network

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    image: billing-service:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ADDRESS}:5432/billing_db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TREATMENT_SERVICE_ADDRESS: treatment-service
      TREATMENT_SERVICE_GRPC_PORT: 9002
      PATIENT_SERVICE_ADDRESS: patient-service
      PATIENT_SERVICE_GRPC_PORT: 9003
    networks:
      - patient-network
    depends_on:
      - treatment-service

  treatment-service:
    build:
      context: .
      dockerfile: treatment-service/Dockerfile
    image: treatment-service:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ADDRESS}:5432/treatment_db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TREATMENT_SERVICE_ADDRESS: treatment-service
      TREATMENT_SERVICE_GRPC_PORT: 9002
    networks:
      - patient-network

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    image: analytics-service:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ADDRESS}:5432/analytics_db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: redis
      GRPC_SERVER_PORT: 9004
    networks:
      - patient-network
    depends_on:
      - redis

  organization-service:
    build:
      context: .
      dockerfile: organization-service/Dockerfile
    image: organization-service:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ADDRESS}:5432/organization_db
      SPRING_DATASOURCE_USERNAME: admin_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      PATIENT_SERVICE_ADDRESS: patient-service
      PATIENT_SERVICE_GRPC_PORT: 9003
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      TREATMENT_SERVICE_ADDRESS: treatment-service
      TREATMENT_SERVICE_GRPC_PORT: 9002
      ANALYTICS_SERVICE_ADDRESS: analytics-service
      ANALYTICS_SERVICE_GRPC_PORT: 9004
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: eu-west-1
    networks:
      - patient-network
    depends_on:
      - patient-service
      - billing-service
      - treatment-service
      - analytics-service

  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    image: search-service:latest
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      OPENSEARCH_HOST: ${OPENSEARCH_ENDPOINT}
      OPENSEARCH_PORT: 443
      PATIENT_SERVICE_ADDRESS: patient-service
      PATIENT_SERVICE_GRPC_PORT: 9003
    networks:
      - patient-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: api-gateway:latest
    environment:
      SERVER_PORT: 4004
    ports:
      - "4004:4004"
    networks:
      - patient-network
    depends_on:
      - patient-service
      - billing-service
      - organization-service

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - api-gateway
    networks:
      - patient-network

networks:
  patient-network:
    driver: bridge
