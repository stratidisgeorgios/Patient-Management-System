apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: patient-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stratidisgeorgios/Patient-Management-System
    targetRevision: main
    path: k8s/services
  destination:
    server: https://kubernetes.default.svc
    namespace: patient-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: patient-system-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stratidisgeorgios/Patient-Management-System
    targetRevision: main
    path: k8s
    directory:
      recurse: false
      include: "namespaces.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
