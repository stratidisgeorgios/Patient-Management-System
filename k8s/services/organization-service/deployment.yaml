apiVersion: apps/v1
kind: Deployment
metadata:
  name: organization-service
  namespace: patient-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: organization-service
  template:
    metadata:
      labels:
        app: organization-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "4005"
    spec:
      serviceAccountName: organization-service
      initContainers:
        - name: otel-agent
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:1.32.0
          command: ["cp", "/javaagent.jar", "/otel/opentelemetry-javaagent.jar"]
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
      containers:
        - name: organization-service
          image: 303357409766.dkr.ecr.eu-west-1.amazonaws.com/patient-system/organization-service:46ca7817bccce5ca5ad0d50be6f3f8e35de6fd87
          ports:
            - containerPort: 4005
              name: http
          env:
            - name: RDS_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: patient-system-secrets
                  key: rds-address
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://$(RDS_ADDRESS)/organization_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: admin_user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patient-system-secrets
                  key: db-password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: AWS_COGNITO_USER_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: patient-system-secrets
                  key: cognito-user-pool-id
            - name: AWS_REGION
              value: eu-west-1
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/opentelemetry-javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: organization-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(HOST_IP):4317"
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 4005
            initialDelaySeconds: 90
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 4005
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
      volumes:
        - name: otel-agent
          emptyDir: {}
